name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          if ($tag -notmatch '^\d+\.\d+\.\d+(?:-\d+)?$') {
            throw "Tag must look like v0.1.0 or v0.1.0-1, got $($env:GITHUB_REF_NAME)"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg/*.dll
          key: ffmpeg-n9.0.2-28-g669f5ab083-win64-lgpl-shared

      - name: Restore FFmpeg
        run: pwsh -NoProfile -File scripts/Restore-Ffmpeg.ps1

      - name: Test
        run: dotnet test HomePlayer.slnx -c Release --nologo --verbosity minimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        env:
          HOMEPLAYER_CERT_SHA1: ${{ secrets.HOMEPLAYER_CERT_SHA1 }}
          HOMEPLAYER_SIGNTOOL: ${{ secrets.HOMEPLAYER_SIGNTOOL }}
        run: pwsh -NoProfile -File installer/build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Installer upgrade smoke test
        run: pwsh -NoProfile -File installer/smoke-test.ps1 -InstallerPath "artifacts/HomePlayer-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $setup = "artifacts/HomePlayer-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          $escaped = [regex]::Escape($env:VERSION)
          $changelog = Get-Content -Path CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## $escaped(?:[^\r\n]*)\r?\n(.*?)(?=^## |\z)")
          if (-not $match.Success) { throw "CHANGELOG.md missing section for $($env:VERSION)" }
          $notesFile = "artifacts/release-notes.md"
          [System.IO.File]::WriteAllText((Join-Path $pwd $notesFile), $match.Groups[1].Value.Trim())
          $checksum = "$setup.sha256"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $pwd $checksum), "$hash  $([IO.Path]::GetFileName($setup))")
          $releaseArgs = @($env:GITHUB_REF_NAME, $setup, $checksum, "--title", "HomePlayer $($env:VERSION)", "--notes-file", $notesFile, "--verify-tag")
          if ($env:VERSION -match '-\d+$') {
            $releaseArgs += "--prerelease"
          } else {
            $releaseArgs += "--latest"
          }
          gh release create @releaseArgs
