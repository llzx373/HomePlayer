name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag.StartsWith("v")) { $tag = $tag.Substring(1) }
          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag must look like v0.1.0, got $($env:GITHUB_REF_NAME)"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg/*.dll
          key: ffmpeg-n9.0.2-28-g669f5ab083-win64-lgpl-shared

      - name: Restore FFmpeg
        run: pwsh -NoProfile -File scripts/Restore-Ffmpeg.ps1

      - name: Test
        run: dotnet test HomePlayer.slnx -c Release --nologo --verbosity minimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pwsh -NoProfile -File installer/build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $setup = "artifacts/HomePlayer-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          gh release create $env:GITHUB_REF_NAME $setup --title "HomePlayer $($env:VERSION)" --notes-file CHANGELOG.md --latest --verify-tag
