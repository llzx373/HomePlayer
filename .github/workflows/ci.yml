name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg/*.dll
          key: ffmpeg-n9.0.2-28-g669f5ab083-win64-lgpl-shared

      - name: Restore FFmpeg
        run: pwsh -NoProfile -File scripts/Restore-Ffmpeg.ps1

      - name: Test
        run: dotnet test HomePlayer.slnx -c Release --nologo --verbosity minimal

      - name: Build
        run: dotnet build src/HomePlayer.App/HomePlayer.App.csproj -c Release --nologo

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pwsh -NoProfile -File installer/build.ps1

      - name: Installer upgrade smoke test
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version }) | Where-Object { $_ } | Select-Object -First 1
          pwsh -NoProfile -File installer/smoke-test.ps1 -InstallerPath "artifacts/HomePlayer-Setup-$version.exe"
